<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>마우스 이벤트</h1>
        <button>버튼</button>
        <button>버튼2</button>
        <script>
            function mClick(){
                console.log('mClick')
            }
            document.getElementsByName('button')[0].onclick = mClick;
            document.getElementsByName('button')[1].onclick = mClick;
        </script>
        <div onclick="msg()"><h2>div</h2></div>
        <script>
            function msg(){
                console.log('응디응디응디노무현')
            }
        </script>
        <p id="mp" onclick="alert('여긴 응디시티 응디응디 응디응디');">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Itaque minus ipsam deserunt iure eos vitae, veniam, vero impedit, minima atque quibusdam. Quos earum architecto voluptas, illo assumenda voluptates quisquam accusamus!</p>
        <script>
            mp.onmouseout = function(){
                console.log('마우스 나갔음');
            }
            mp.onmouseover = function(){
                console.log('마우스 올라옴');
            }
        </script>
    </div>
</body>
</html>
